[build]
  command = "npm run build"
  publish = "_site"

# Security headers for the whole site, including /admin (Decap CMS).
# The Content-Security-Policy is NOT set here: it is a <meta http-equiv> tag in
# base.njk, blog-post.njk and run-2026-09.njk, so /admin (which loads Decap from
# unpkg and needs inline scripts) is not affected. frame-ancestors only works as
# a header, so clickjacking protection is X-Frame-Options instead.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Blog post was Sortengold content, removed from zuricaf.com (Lorenz 09.11.2026).
[[redirects]]
  from = "/blog/kette-des-respekts/"
  to = "/"
  status = 301
[[redirects]]
  from = "/blog-kette-des-respekts/"
  to = "/"
  status = 301

# /lot-info/ (delegation May 2026) replaced by /direct-trade/ (Lorenz 09.11.2026).
# Forced (!) because the page files stay in the repo, so the Netlify form
# "coffee-lot-info" and its past submissions are not touched.
[[redirects]]
  from = "/lot-info/thanks/"
  to = "/direct-trade-thanks/"
  status = 301
  force = true
[[redirects]]
  from = "/lot-info/"
  to = "/direct-trade/"
  status = 301
  force = true
